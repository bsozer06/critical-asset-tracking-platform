<div class="app-root">
	<div class="topbar" style="display: flex; align-items: center; padding: 8px 16px; background: #222; color: #fff; gap: 16px; justify-content: space-between;">
		<div style="display: flex; align-items: center; gap: 16px;">
			<connection-status-badge [status]="connectionStatus"></connection-status-badge>
			<span style="font-weight: bold; font-size: 18px;">Critical Asset Tracking Platform</span>
		</div>
		<div class="geofence-controls">
			<button *ngIf="!isDrawingGeofence" 
					(click)="startDrawingGeofence()"
					class="btn btn-primary"
					title="Draw a new geofence on the map">
				📍 Draw Geofence
			</button>
			<button *ngIf="isDrawingGeofence" 
					(click)="cancelGeofenceDrawing()"
					class="btn btn-danger"
					title="Cancel geofence drawing">
				✕ Cancel Drawing
			</button>
			<span *ngIf="geofences.length > 0" class="geofence-count">
				{{ geofences.length }} Geofence(s)
			</span>
		</div>
	</div>

	<div class="main-layout">
		<div class="map-area">
			<app-cesium-map 
				(geofenceCreated)="onGeofenceCreated($event)"
				(violationDetected)="onViolationDetected($event)">
			</app-cesium-map>
		</div>
		<div class="panel-area">
			<app-telemetry-panel (assetSelected)="onAssetSelected($event)"></app-telemetry-panel>
		</div>
	</div>

	<!-- Geofence Alert -->
	<app-geofence-alert 
		*ngIf="showGeofenceAlert"
		[violations]="activeViolations"
		[autoHideDuration]="15000"
		(dismissed)="onAlertDismissed()">
	</app-geofence-alert>

	<!-- Snackbar -->
	<div *ngIf="snackbarVisible" style="position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #e53935; color: #fff; padding: 12px 32px; border-radius: 8px; font-size: 16px; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
		{{ snackbarMessage }}
	</div>
</div>
