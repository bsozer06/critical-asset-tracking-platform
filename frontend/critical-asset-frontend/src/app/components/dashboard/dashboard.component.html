<div class="app-root">
	<header class="topbar">
		<div class="topbar-left">
			<connection-status-badge [status]="connectionStatus"></connection-status-badge>
			<span class="topbar-title">Critical Asset Tracking Platform</span>
		</div>
		<div class="topbar-right">
			@if (currentUser) {
				<div class="user-info">
					<span class="user-email">{{ currentUser.email }}</span>
					<span class="user-role-badge">{{ currentUser.role }}</span>
				</div>
				<button class="signout-btn" (click)="onLogout()">Sign Out</button>
			}
		</div>
	</header>

	<div class="main-layout">
		<div class="map-area">
			<app-cesium-map (geofenceCreated)="onGeofenceCreated($event)"></app-cesium-map>
		</div>
		<div class="panel-area">
			<app-telemetry-panel (assetSelected)="onAssetSelected($event)"></app-telemetry-panel>
		</div>
	</div>

	@if (showGeofenceAlert) {
		<app-geofence-alert
			[violations]="activeViolations"
			[autoHideDuration]="15000"
			(dismissed)="onAlertDismissed()">
		</app-geofence-alert>
	}

	<app-geofence-panel></app-geofence-panel>

	@if (snackbarVisible) {
		<div class="snackbar">{{ snackbarMessage }}</div>
	}
</div>
