<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Critical Asset Tracking Platform</h1>
    <h2 class="login-subtitle">Sign in to continue</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required.</mat-error>
      </mat-form-field>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="full-width login-button"
        [disabled]="form.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
        <span *ngIf="!loading">Sign In</span>
      </button>
    </form>
  </div>
</div>
