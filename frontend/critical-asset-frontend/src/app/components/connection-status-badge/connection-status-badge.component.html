<span [ngClass]="{
      'badge': true,
      'connected': status === 'connected',
      'disconnected': status === 'disconnected',
      'reconnecting': status === 'reconnecting',
      'error': status === 'error'
    }">
      <span style="display: inline-block; margin-right: 6px;">●</span>
      {{ status | titlecase }}
    </span>
