<span [ngClass]="{
      'badge': true,
      'connected': status === 'connected',
      'disconnected': status === 'disconnected',
      'reconnecting': status === 'reconnecting',
      'error': status === 'error'
    }">
  <span class="status-dot"></span>
  <span class="status-text">{{ status | titlecase }}</span>
</span>
